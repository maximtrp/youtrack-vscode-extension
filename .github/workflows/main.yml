name: Publish

on:
  release:
    types: [created]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Verify the release tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@^3 package --out youtrack-ext-${{ github.ref_name }}.vsix

      - name: Attach the package to the release
        run: gh release upload "$GITHUB_REF_NAME" youtrack-ext-${{ github.ref_name }}.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@^3 publish --packagePath youtrack-ext-${{ github.ref_name }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx --yes ovsx@^0.10 publish youtrack-ext-${{ github.ref_name }}.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
